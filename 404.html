<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en mantención</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --udo-azul: #1167a4;
            --udo-azul-oscuro: #0b4b7a;
            --udo-amarillo: #f6b01c;
            --udo-amarillo-oscuro: rgb(252, 176, 24);
            --udo-gris: #a0a09f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #F8F8F8;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed; 
            top: 0;
            left: 0;
            width: 120vw;
            height: 120vh;
            margin-top: -10vh;
            margin-left: -10vw;
            background-image: url('https://raw.githubusercontent.com/hspudo-Develop/Repo_IMG_HSP_Coquimbo/refs/heads/main/Sub_Logo-removebg-preview.png');
            background-repeat: no-repeat;
            background-position: center center; 
            background-size: 50%; 
            opacity: 0.60; 
            z-index: -10; 
            pointer-events: none; 
            transform: rotate(10deg); 
            transform-origin: center center; 
        }


        .error-udo-section {
            padding: 100px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            background: transparent; 
        }


        .error-udo-card {
            background: #FFFFFF; 
            border-radius: 24px; 
            padding: 50px 40px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.05); 
            border-top: 6px solid var(--udo-amarillo); 
            text-align: center;
            max-width: 550px;
            width: 100%;
            font-family: 'Source Sans 3', sans-serif; 
        }

        .error-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .error-bullet {
            width: 16px;
            height: 16px;
            background: var(--udo-amarillo); 
            border-radius: 50%; 
            flex-shrink: 0;
        }

        .error-title-area h2 {
            margin: 0;
            font-family: 'Poppins', sans-serif; 
            font-size: 22px;
            color: var(--udo-gris); 
            font-weight: 600;
        }

        .error-code {
            font-family: 'Poppins', sans-serif; 
            font-size: 110px;
            font-weight: 700;
            color: var(--udo-azul); 
            line-height: 1;
            margin: 0 0 15px 0;
            letter-spacing: -2px;
        }

        .error-subtitle {
            font-family: 'Poppins', sans-serif; 
            font-size: 26px;
            color: var(--udo-amarillo-oscuro); 
            font-weight: 600;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 18px;
            color: #4F5B6B; 
            line-height: 1.7; 
            margin-bottom: 40px;
        }

        .udo-btn-volver {
            display: inline-block;
            background: var(--udo-azul); 
            color: #FFFFFF; 
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            font-family: 'Poppins', sans-serif; 
            box-shadow: 0 4px 12px rgba(17, 103, 164, 0.18); 
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease; 
        }

        .udo-btn-volver:hover {
            background: var(--udo-azul-oscuro); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(17, 103, 164, 0.3); 
        }

        .udo-btn-volver:active {
            transform: translateY(0); 
        }

        @media (max-width: 768px) {
            .error-udo-section {
                padding: 60px 20px;
            }
            
            .error-udo-card {
                padding: 40px 25px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-subtitle {
                font-size: 22px;
            }

            .error-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <section class="error-udo-section">
        <div class="error-udo-card">
            
            <div class="error-title-area">
                <div class="error-bullet"></div>
                <h2>Aviso del Sistema</h2>
            </div>
            
            <div class="error-code" aria-hidden="true">
                <svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            </div>
            
            <h1 class="error-subtitle">Página en mantención</h1>
            <p class="error-text">
                En estos momentos estamos realizando trabajos de mantención en este sitio. Por favor, inténtalo nuevamente más tarde.
            </p>
            
            <a href="/firma-institucional-hsp/" class="udo-btn-volver">Intentar nuevamente</a>
            
        </div>
    </section>

</body>
</html>
